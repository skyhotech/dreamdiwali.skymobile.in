# Deploys main to the production VPS after CI passes: the built studio, the
# backend code and the frames. MySQL data and uploaded images are never touched.
# Needs repo secrets VPS_HOST, VPS_SSH_KEY and VPS_KNOWN_HOSTS; without them
# the job skips itself.
name: Deploy to VPS
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Check deploy settings
        id: cfg
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::VPS_HOST secret not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          # The exact commit CI just tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build the studio
        if: steps.cfg.outputs.skip != 'true'
        env:
          VITE_API_URL: https://87.232.72.141
        run: npm ci && npm run build
      - uses: actions/setup-python@v5
        if: steps.cfg.outputs.skip != 'true'
        with:
          python-version: "3.12"
      # The VPS cannot reach PyPI, so packages are downloaded here and sent along.
      - name: Download Python packages for the VPS
        if: steps.cfg.outputs.skip != 'true'
        run: |
          grep -v mysqlclient backend/requirements.txt | sed 's/;.*//' > /tmp/req.txt
          echo setuptools >> /tmp/req.txt
          echo wheel >> /tmp/req.txt
          pip download -q -d wheels --only-binary=:all: --python-version 3.12 \
            --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 -r /tmp/req.txt
          v=$(grep -o 'mysqlclient==[0-9.]*' backend/requirements.txt | cut -d= -f3)
          curl -fsSL -o "wheels/mysqlclient-$v.tar.gz" \
            "$(curl -fsS "https://pypi.org/pypi/mysqlclient/$v/json" | python -c "import json,sys;print([u['url'] for u in json.load(sys.stdin)['urls'] if u['packagetype']=='sdist'][0])")"
      - name: SSH key
        if: steps.cfg.outputs.skip != 'true'
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
      - name: Upload
        if: steps.cfg.outputs.skip != 'true'
        run: |
          R="deployer@$HOST"
          # The server's .env, database, photos and venv stay put.
          rsync -az --delete \
            --exclude .env --exclude '.env.*' --exclude '.venv/' --exclude 'db.sqlite3*' \
            --exclude 'media/' --exclude 'backups/' --exclude 'staticfiles/' --exclude '__pycache__/' \
            backend/ "$R:/opt/skymirror/backend/"
          rsync -az --delete public/frames/ "$R:/opt/skymirror/public/frames/"
          # Old code files stay, so pages open during a deploy keep working.
          rsync -az dist/ "$R:/opt/skymirror/web/"
          rsync -az --delete wheels/ "$R:/opt/skymirror/wheels/"
          rsync -az deploy/vps/remote-deploy.sh "$R:/opt/skymirror/remote-deploy.sh"
      - name: Install and restart
        if: steps.cfg.outputs.skip != 'true'
        run: ssh "deployer@$HOST" bash /opt/skymirror/remote-deploy.sh
      - name: Check the live site
        if: steps.cfg.outputs.skip != 'true'
        run: |
          for i in $(seq 1 10); do
            curl -fsS -o /dev/null "https://87.232.72.141/api/mirrors/version/" && { echo "Live"; exit 0; }
            sleep 3
          done
          echo "::error::the live site is not responding after deploy"; exit 1
